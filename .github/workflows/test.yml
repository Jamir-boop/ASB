name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22.13.0
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # rpmbuild: the build and its tests make and check the RPM only when it exists.
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm test
      - run: python3 test/asb_native_logic_test.py
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '24'
        with:
          name: asb-linux
          path: |
            dist/asb_*_all.deb
            dist/asb-*.noarch.rpm
            dist/asb-*-linux.tar.gz
            dist/PKGBUILD
            dist/SHA256SUMS
  windows-test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version:
          - 22.13.0
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Only the platform-neutral tests (test/windows-tests.json): no POSIX modes, /bin/sh, systemctl, or Unix sockets.
      - run: node --test --no-experimental-strip-types $(node -p "require('./test/windows-tests.json').join(' ')")
        shell: bash
  bridge-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # The tests that need Unix socket files, /tmp, modes, links, or signals skip on Windows (test.skipIf).
      - run: bun test
